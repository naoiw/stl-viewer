name: Deploy to GitHub Pages

# Production at /, develop preview at /develop/.
# Runs from main so the github-pages environment can restrict deploys to main.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Validate develop]
    types: [completed]
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stl-viewer-pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.ref_name == 'main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          ref: main
          path: production
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'develop' }}
          path: preview
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          check-latest: true
      - name: Build production
        working-directory: production
        run: |
          npm install --no-audit --no-fund
          npm run build:pages:main
      - name: Build develop preview
        working-directory: preview
        run: |
          npm install --no-audit --no-fund
          npm run build:pages:develop
      - name: Combine sites
        run: |
          mkdir -p publish/develop
          cp -a production/dist/. publish/
          cp -a preview/dist/. publish/develop/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
